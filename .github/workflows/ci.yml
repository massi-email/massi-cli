name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        # Install the latest 10.0 SDK. global.json pins 10.0.0 with rollForward, which
        # setup-dotnet's global-json-file mode would try to fetch as an exact (nonexistent)
        # build; the build still honors global.json's rollForward at compile time.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Massi.sln

      - name: Build
        run: dotnet build Massi.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Massi.sln --configuration Release --no-build
